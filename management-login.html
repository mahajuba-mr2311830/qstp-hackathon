<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Management Login | Pulse Digest</title>
  <link rel="stylesheet" href="management-login.css" />
</head>

<body>
  <main class="login-page">
    <section class="login-card">
      <a href="index.html" class="back-link">← Back to Pulse Digest</a>

      <div class="login-header">
        <div class="admin-icon">M</div>
        <h2>Management Login</h2>
        <p>Please enter your authorised management credentials.</p>
      </div>

      <form id="managementLoginForm">
        <div class="form-group">
          <label for="email">Work email address</label>
          <input type="email" id="email" name="email" placeholder="manager@organisation.com" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" name="password" placeholder="Enter your password" required />
            <button type="button" id="togglePassword">Show</button>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" />
            Remember this device
          </label>

          <a href="#">Need help?</a>
        </div>

        <button type="submit" class="login-btn">Sign in as Management</button>

        <p class="form-message" id="formMessage"></p>
      </form>
    </section>
  </main>

  <script src="management-login.js"></script>
</body>

</html>
