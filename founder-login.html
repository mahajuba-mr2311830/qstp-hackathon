<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Founder Login | Pulse Digest</title>
  <link rel="stylesheet" href="founder-login.css" />
</head>
<body>
  <main class="login-page">
    <section class="login-card">
      <a href="index.html" class="back-link">← Back to Pulse Digest</a>
      <div class="login-header">
        <h2>Founder Login</h2>
        <p>Please enter your details to continue.</p>
      </div>

      <form id="founderLoginForm">
        <div class="form-group">
          <label for="email">Email address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="founder@company.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              required
            />
            <button type="button" id="togglePassword">Show</button>
          </div>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" />
            Remember me
          </label>

          <a href="#">Forgot password?</a>
        </div>

        <button type="submit" class="login-btn">Sign in as Founder</button>

        <p class="form-message" id="formMessage"></p>
      </form>
    </section>
  </main>

  <script src="founder-login.js"></script>
</body>
</html>
